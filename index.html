<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake Game</title>

  <!-- Firebase (remove these two lines if you don't need the live leaderboard) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <!-- Snake Game engine -->
  <script src="snake-game.js"></script>
</head>
<body>
  <script>
    SnakeGame.init({

      // ── Required ─────────────────────────────────────────────
      accessCode: "Bestofus@!",

      // ── Firebase (optional — for live cross-device leaderboard)
      // firebase: {
      //   apiKey:            "YOUR_API_KEY",
      //   authDomain:        "YOUR_PROJECT_ID.firebaseapp.com",
      //   databaseURL:       "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      //   projectId:         "YOUR_PROJECT_ID",
      //   storageBucket:     "YOUR_PROJECT_ID.appspot.com",
      //   messagingSenderId: "YOUR_SENDER_ID",
      //   appId:             "YOUR_APP_ID"
      // },

      // ── Game settings (all optional) ─────────────────────────
      speed:            120,   // ms per tick — lower = faster
      canvasSize:       400,   // px
      bonusPoints:      5,     // points for grabbing the star
      bonusDuration:    5000,  // ms bonus stays on screen
      bonusInterval:    8000,  // ms between bonus spawns
      obstacleDuration: 4000,  // ms obstacle stays on screen
      obstacleInterval: 6000,  // ms between obstacle spawns

    });
  </script>
</body>
</html>
